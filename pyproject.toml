[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-payment-doctor"
version = "1.0.0"
description = "Audit a WooCommerce payment attempts CSV export for lost revenue, card-testing bursts, and failing gateways"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
woo-payment-doctor = "woo_payment_doctor:main_entry"

[tool.setuptools]
py-modules = ["woo_payment_doctor"]
